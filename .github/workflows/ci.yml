name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monthly, so a site's rules going stale fails a run even when nothing is pushed (src/data/platforms.test.ts).
  schedule:
    - cron: "0 6 1 * *"

jobs:
  check:
    name: Types, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

      # Fails the run if accessibility, best practices or SEO drop below 100, or performance below 95, on a phone.
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.1 autorun

  e2e:
    name: Browser tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
